# =============================================================================
# Inventaire Ansible - Cluster 2
# A lancer depuis le dossier linux-host/ (les chemins .vagrant/... sont relatifs).
#
# master + worker1 : VMs VirtualBox sur le PC Windows (192.168.100.6), joints via
#   un saut SSH (-J). Copier d'abord leurs clés privées Vagrant sur cette machine
#   (voir docs/GUIDE.md, étape 4 bis) :  ~/.ssh/k8s2-master_key, ~/.ssh/k8s2-worker1_key
# worker2 + worker3 : VMs KVM locales ; clé générée par Vagrant dans .vagrant/.
#   Leurs IP 192.168.121.x sont attribuées en DHCP par libvirt : elles peuvent changer
#   après un "vagrant destroy". Vérifier avec :  vagrant ssh-config
# =============================================================================

[masters]
k8s2-master ansible_host=192.168.100.111 ansible_ssh_private_key_file=~/.ssh/k8s2-master_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -J Administrateur@192.168.100.6'

[workers]
k8s2-worker1 ansible_host=192.168.100.112 ansible_ssh_private_key_file=~/.ssh/k8s2-worker1_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -J Administrateur@192.168.100.6'
k8s2-worker2 ansible_host=192.168.121.120 ansible_ssh_private_key_file=.vagrant/machines/k8s2-worker2/libvirt/private_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
k8s2-worker3 ansible_host=192.168.121.174 ansible_ssh_private_key_file=.vagrant/machines/k8s2-worker3/libvirt/private_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[cluster2:children]
masters
workers

[cluster2:vars]
ansible_user=vagrant
