# ============================================================
# inventory.ini — Cluster 2
# ============================================================

[masters]
k8s2-master ansible_host=192.168.100.111

[workers]
k8s2-worker1 ansible_host=192.168.100.112
k8s2-worker2 ansible_host=192.168.100.113
k8s2-worker3 ansible_host=192.168.100.114

[cluster2:children]
masters
workers

[cluster2:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
